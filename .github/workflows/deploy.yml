name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build project
        run: bun run build
        env:
          VITE_SUPABASE_URL: '${{ secrets.VITE_SUPABASE_URL || "https://ibzfibfgywrprnmvzptn.supabase.co" }}'
          VITE_SUPABASE_ANON_KEY: '${{ secrets.VITE_SUPABASE_ANON_KEY || "sb_publishable_RXUCwg8zG2--VaDAqMQOCg__s6NdHr2" }}'

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GSS_KUBWA_YEARBOOK }}'
          channelId: live
          projectId: gss-kubwa-yearbook

      - name: Deploy Firestore Rules
        uses: w9jds/firebase-action@master
        continue-on-error: true
        with:
          args: deploy --only firestore:rules
        env:
          GCP_SA_KEY: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GSS_KUBWA_YEARBOOK }}'
          PROJECT_ID: gss-kubwa-yearbook
